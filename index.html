<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Document</title>
	<link rel="stylesheet" href="css/font.css">
	<link rel="stylesheet" href="css/normalize.css" />
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/main.css" />
</head>

<body>
	<div class="wrapper">
		<div class="hidden__window">
			<div class="modal__window">
				<div class="window__end">
					<div class="window-text">
					</div>
					<div class="window-button">
						<button id="reset"></button>
					</div>
				</div>
			</div>
		</div>
		<div class="hidden__window">
			<div class="modal__window">
				<div class="window__options">
					<div class="win__player two-line text"></div>
					<div class="input__name-text two-line text">Enter name players</div>
					<input type="text" id="input__name-first__player" placeholder="Enter the first player">
					<input type="text" id="input__name-second__player" placeholder="Enter the second player">
					<!-- <div class="choice__icon-text two-line text">Select the players icon</div>
					<div class="choice__icon-first__player conteiner-img">
						<img src="img/one-cross.png" alt="" class="choice__icon-first__player__item-1 icon__first__player">
						<img src="img/two-cross.png" alt="" class="choice__icon-first__player__item-2 icon__first__player">
						<img src="img/three-cross.png" alt="" class="choice__icon-first__player__item-3 icon__first__player">
					</div>
					<div class="choice__icon-second__player conteiner-img">
						<img src="img/one-krug.png" alt="" class="choice__icon-second__player__item-1 icon__second__player">
						<img src="img/two-krug.png" alt="" class="choice__icon-second__player__item-2 icon__second__player">
						<img src="img/three-krug.png" alt="" class="choice__icon-second__player__item-3 icon__second__player">
					</div> -->
					<div class="input__score two-line text">Enter the final invoice (max 99)</div>
					<input type="text" id="input__last__score" class="two-line" maxlength="2">
					<button id="launch" class="two-line text">play</button>
				</div>
			</div>
		</div>
		<main>
			<div class="field">
				<div class="field-item field-item-left field-item-top"></div>
				<div class="field-item field-item-top window-2"></div>
				<div class="field-item field-item-top field-item-right"></div>
				<div class="field-item field-item-left"></div>
				<div class="field-item"></div>
				<div class="field-item field-item-right"></div>
				<div class="field-item field-item-left field-item-bottom"></div>
				<div class="field-item field-item-bottom"></div>
				<div class="field-item field-item-bottom field-item-right"></div>
			</div>
			<aside>
				<div class="infobar">
					<div class="infobar__first-player grid-item">
						<div class="going__first__player going"></div>
						<h2></h2>
						<img src="img/three-cross.png" alt="logo first player">
						<div class="score" id="scoreFirstPlayer">0</div>
					</div>
					<div class="infobar__second-player grid-item">
						<div class="going__second__player going"></div>
						<h2></h2>
						<img src="img/three-krug.png" alt="logo second player">
						<div class="score" id="scoreSecondPlayer">0</div>
					</div>
				</div>
			</aside>
		</main>
	</div>
	<script src="js/main.js"></script>
</body>

</html>
