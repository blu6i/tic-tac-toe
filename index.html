<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Document</title>
	<link rel="stylesheet" href="css/font.css">
	<link rel="stylesheet" href="css/normalize.css" />
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/main.css" />
</head>

<body>
	<div class="wrapper">
		<div id="hidden__window">
			<div id="modal__window">
				<div class="window">
					<div class="window-text">
					</div>
					<div class="window-button">
						<button id="reset"></button>
					</div>
				</div>
			</div>
		</div>
		<main>
			<div class="field">
				<div class="field-item field-item-left field-item-top"></div>
				<div class="field-item field-item-top window-2"></div>
				<div class="field-item field-item-top field-item-right"></div>
				<div class="field-item field-item-left"></div>
				<div class="field-item"></div>
				<div class="field-item field-item-right"></div>
				<div class="field-item field-item-left field-item-bottom"></div>
				<div class="field-item field-item-bottom"></div>
				<div class="field-item field-item-bottom field-item-right"></div>
			</div>
			<aside>
				<div class="infobar">
					<div class="infobar__first-player grid-item">
						<h2>First player</h2>
						<img src="img/10-103856_red-cross-mark-png-transparent-images-x-marks.png" alt="logo first player">
						<div class="score" id="scoreFirstPlayer">0</div>
					</div>
					<div class="infobar__second-player grid-item">
						<h2>Second player</h2>
						<img src="img/0_krug-png_-2-tys-izobrazhenij-najdeno-v-YAndeks.Kartinkah.png"
							alt="logo second player">
						<div class="score" id="scoreSecondPlayer">0</div>
					</div>
				</div>
			</aside>
		</main>
	</div>
	<script src="js/main.js"></script>
</body>

</html>
